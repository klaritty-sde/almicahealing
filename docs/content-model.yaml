# Álmica Healing — content model specification.
#
# Technology-aware domain model derived from Figma "Website - MV1"
# (node 146-30). NOT an ACF export: ACF field groups, spreadsheet
# templates, importers and docs are generated/derived from this file.
# Narrative, rationale and open questions: docs/content-model.md.
#
# Conventions
#   source: native WP field the value lives in (post_title, post_name,
#           post_excerpt, post_content, featured_image, menu_order);
#           omitted = custom field (Secure Custom Fields, ACF-compatible API).
#   limit:  layout recommendation (soft), not a business rule.
#   open_question: id in content-model.md#open-questions.

version: 0.2.0
status: proposal
phase: 1   # MV1 only; see `deferred`.

decisions:   # 2026-09-19, see content-model.md#decisions-2026-09-19
  D1: MV1 is phase 1; shop, Contáctanos page and booking deferred.
  D2: No ACF Pro. Secure Custom Fields (free), fields registered in code; hand-coded meta as fallback.
  D3: Contact data from current inc/brand.php is canonical; one contact_email.
  D4: Unconfirmed therapists left blank; servicio.professionals optional.
  D5: servicio.modality is a single-select enum.
  D6: Booking skipped.

field_plugin:
  name: Secure Custom Fields
  slug: secure-custom-fields
  license: free (GPL)
  api: acf_compatible   # acf_add_local_field_group, get_field, acf_add_options_page
  registration: code    # almicahealing-core; never via admin UI
  fallback: hand_coded_post_meta

source:
  figma_file: wcICEZt3AHW63rtHEdVUxW
  figma_page: "Website - MV1"
  figma_node: "146-30"
  inspected: 2026-09-18

defaults:
  currency: MXN
  locale: es_MX

content_types:

  servicio:
    label: Servicio
    purpose: Individually bookable session; card in listings + detail page.
    wordpress_type: post_type
    post_type: servicio
    exists: true
    public: true
    has_archive: false
    rewrite_slug: servicios
    supports: [title, editor, excerpt, thumbnail, page-attributes]
    editor_managed: true
    template: single-servicio.php
    fields:
      title:        { source: post_title, type: text, required: true, limit: 60 }
      slug:         { source: post_name, type: slug, required: true, identifier: true }
      summary:      { source: post_excerpt, type: textarea, required: true, limit: 160,
                      note: Hero subtitle fallback and SEO description. }
      tagline:      { type: text, required: false, fallback: summary }
      description:  { source: post_content, type: rich_text, required: true }
      card_image:   { source: featured_image, type: image, required: true, min_size: 800x1000 }
      hero_image:   { type: image, required: false, fallback: card_image }
      price:        { type: number, required: true, min: 0, decimals: 2, unit: MXN }
      price_basis:  { type: text, required: false, fallback: "settings.service_price_basis" }
      duration_minutes:
        type: number
        required: true
        default: 60
        min: 15
        max: 480
        step: 15
        note: Rendered twice (hero chip + Inversión card); stored once.
      modality:
        type: select
        required: true
        default: presencial
        options: { presencial: Presencial, virtual: Virtual, hibrida: Presencial y virtual }
        decision: D5
      benefits:
        type: repeater
        required: true
        cardinality: 1..6
        fields:
          icon:        { type: select, required: true, options_from: theme_icon_set, open_question: Q8 }
          title:       { type: text, required: true, limit: 70 }
          description: { type: textarea, required: false, limit: 140 }
      professionals:
        type: relationship
        target: profesional
        required: false
        cardinality: 0..3
        empty_behaviour: hide "Quién imparte" section
        decision: D4
      related_services:
        type: relationship
        target: servicio
        required: false
        cardinality: 0..3
        default: auto_next_by_menu_order
        open_question: Q5
      is_featured:
        type: boolean
        default: false
        note: Home teaser (6 slots). Migrates legacy meta _almicahealing_featured.
      includes_workbook: { type: boolean, default: false, open_question: Q6 }
      order:        { source: menu_order, type: number, default: 0 }

  curso:
    label: Curso
    purpose: Multi-week training program led by a facilitator.
    wordpress_type: post_type
    post_type: curso
    exists: true
    public: true
    has_archive: false
    rewrite_slug: cursos
    supports: [title, editor, excerpt, thumbnail, page-attributes]
    editor_managed: true
    template: single-curso.php
    fields:
      title:        { source: post_title, type: text, required: true }
      slug:         { source: post_name, type: slug, required: true, identifier: true }
      summary:      { source: post_excerpt, type: textarea, required: true, limit: 160,
                      note: Card text; differs from hero tagline in Figma. }
      tagline:      { type: text, required: false, fallback: summary }
      description:  { source: post_content, type: rich_text, required: true }
      image:        { source: featured_image, type: image, required: true }
      program_label: { type: text, required: true, limit: 50, open_question: Q9 }
      level:
        type: select
        required: true
        options: { basico: Básico, intermedio: Intermedio, abierto: Abierto a todos }
        note: Field, not taxonomy — 3 fixed values, no per-level listing.
      price:
        type: number
        required: false
        min: 0
        decimals: 0
        unit: MXN
        empty_means: price_on_request
      duration:     { type: text, required_if: price, limit: 30, example: "2 meses" }
      outcomes_heading:
        type: select
        required: true
        default: objetivos
        options: { objetivos: Objetivos, beneficios: Beneficios, temas: Temas }
      outcomes:
        type: repeater
        required: true
        cardinality: 1..10
        numbering: automatic
        fields:
          text: { type: text, required: true, limit: 160 }
      facilitators:
        type: relationship
        target: profesional
        required: true
        cardinality: 1..2
      order:        { source: menu_order, type: number, default: 0 }
    derived:
      other_courses: all other published curso, by menu_order

  profesional:
    label: Profesional
    purpose: Therapist / facilitator / founder, referenced wherever they appear.
    wordpress_type: post_type
    post_type: profesional
    exists: false
    public: false
    show_ui: true
    supports: [title, editor, thumbnail, page-attributes]
    editor_managed: true
    open_question: Q7
    fields:
      name:   { source: post_title, type: text, required: true }
      slug:   { source: post_name, type: slug, required: true, identifier: true }
      role:   { type: text, required: true, limit: 100 }
      bio:    { source: post_content, type: rich_text, required: true }
      photo:  { source: featured_image, type: image, required: true, min_size: 400x400, crop: square }
      credentials:
        type: repeater
        required: false
        cardinality: 0..n
        fields:
          title:       { type: text, required: true }
          year:        { type: number, required: false, pattern: "^[0-9]{4}$" }
          institution: { type: text, required: false }
          description: { type: textarea, required: false }
      order:  { source: menu_order, type: number, default: 0 }

  testimonio:
    label: Testimonio
    purpose: Client quote shown in the Home slider.
    wordpress_type: post_type
    post_type: testimonio
    exists: true
    public: false
    supports: [title, editor, page-attributes]
    editor_managed: true
    fields:
      client_name: { source: post_title, type: text, required: true,
                     note: "Editorial rule: first name + initial." }
      quote:       { source: post_content, type: textarea, required: true, limit: 300 }
      about:
        type: post_object
        target: [servicio, curso]
        required: false
        cardinality: 0..1
        note: Replaces legacy free-text post_excerpt label.
      order:       { source: menu_order, type: number, default: 0 }

taxonomies: {}   # none in phase 1 (categoria_producto deferred with the shop)

pages:
  home:
    wordpress_type: page
    front_page: true
    template: front-page.php
    field_groups: [page_hero, home]
    queries:
      services_teaser: { post_type: servicio, where: { is_featured: true }, limit: 6, order: menu_order }
      courses_teaser:  { post_type: curso, limit: 3, order: menu_order }
      testimonials:    { post_type: testimonio, order: menu_order }
  acerca_de:
    wordpress_type: page
    slug: acerca-de
    template: page-acerca-de.php
    field_groups: [page_hero, acerca_de]
    body: post_content   # "Nosotros" history text
  servicios:
    wordpress_type: page
    slug: servicios
    template: page-servicios.php
    field_groups: [page_hero]
    queries:
      catalog: { post_type: servicio, order: menu_order }
  cursos:
    wordpress_type: page
    slug: cursos
    template: page-cursos.php
    exists: false
    field_groups: [page_hero]
    queries:
      catalog: { post_type: curso, order: menu_order }
  aviso_de_privacidad:
    wordpress_type: page
    slug: aviso-de-privacidad
    template: page-templates/legal.php
    body: post_content   # intro + H2 sections, auto-numbered
  terminos_y_condiciones:
    wordpress_type: page
    slug: terminos-y-condiciones
    template: page-templates/legal.php
    body: post_content

field_groups:
  page_hero:
    fields:
      hero_eyebrow:   { type: text }
      hero_title:     { type: text, required: true }
      hero_subtitle:  { type: textarea }
      hero_image:     { type: image }
      hero_cta_label: { type: text }
      hero_cta_url:   { type: link }
  home:
    fields:
      intro:          { type: group, fields: { title: text, body: rich_text, image: image, cta: link } }
      services_intro: { type: group, fields: { eyebrow: text, title: text, subtitle: textarea } }
      process_steps:
        type: repeater
        cardinality: 3..3
        fields: { title: { type: text, required: true }, body: { type: textarea, required: true } }
      quote:          { type: group, fields: { line_1: text, line_2: text, image: image } }
      courses_intro:  { type: group, fields: { eyebrow: text, title: text, body: textarea } }
      testimonials_title: { type: text }
  acerca_de:
    fields:
      founder:
        type: post_object
        target: profesional
        required: true
        note: Founder block + "Formación" (from founder.credentials).

settings:
  wordpress_type: options_page
  key: almica-ajustes
  label: Ajustes de Álmica
  fields:
    contact_email:          { type: email, required: true, initial: almicahealing@gmail.com, decision: D3,
                              used_by: [footer, course_inquiry_card, legal_contact_note] }
    phone:                  { type: text, required: true, initial: "+52 81 7008 8058", decision: D3 }
    whatsapp:               { type: text, required: false, initial: "", hide_when_empty: true }
    location_label:         { type: text, initial: "México · sesiones virtuales", decision: D3 }
    social_instagram:       { type: url, initial: "", hide_when_empty: true }
    social_facebook:        { type: url, initial: "", hide_when_empty: true }
    social_tiktok:          { type: url, initial: "", hide_when_empty: true }
    footer_blurb:           { type: textarea }
    footer_tagline:         { type: text, figma: "El equilibrio que da origen a todo" }
    currency_label:         { type: text, default: MXN }
    service_price_basis:    { type: text, default: "por sesión individual" }
    price_on_request_text:  { type: text, default: "Escríbenos para conocer el precio" }
    course_inquiry_title:   { type: text, default: "¿Te interesa este programa?" }
    course_inquiry_body:    { type: textarea }
    legal_contact_note:     { type: textarea }
  menus: [primary, footer]   # native WP nav menus

relationships:
  - { from: servicio.professionals,   to: profesional, cardinality: "n:m", required: false }
  - { from: servicio.related_services, to: servicio,   cardinality: "n:m", required: false }
  - { from: curso.facilitators,       to: profesional, cardinality: "n:m", required: true }
  - { from: testimonio.about,         to: [servicio, curso], cardinality: "n:1", required: false }
  - { from: page.acerca_de.founder,   to: profesional, cardinality: "1:1", required: true }

import:
  identifier: slug
  seed_key_format: "{post_type}-{slug}"   # matches existing _almicahealing_seed_key
  multi_value_separator: "|"
  paragraph_separator: blank_line
  boolean_values: { "true": "sí", "false": "no" }
  order: [profesionales, profesional_formacion, servicios, servicio_beneficios,
          cursos, curso_puntos, testimonios, ajustes]
  sheets:
    servicios:
      maps_to: servicio
      columns: [slug, title, order, is_featured, summary, tagline, description, price,
                price_basis, duration_minutes, modality, professionals, card_image,
                hero_image, includes_workbook, status]
    servicio_beneficios:
      maps_to: servicio.benefits
      parent_key: servicio_slug
      columns: [servicio_slug, position, icon, title, description]
    cursos:
      maps_to: curso
      columns: [slug, title, order, level, program_label, summary, tagline, description,
                price, duration, outcomes_heading, facilitators, image, status]
    curso_puntos:
      maps_to: curso.outcomes
      parent_key: curso_slug
      columns: [curso_slug, position, text]
    profesionales:
      maps_to: profesional
      columns: [slug, name, role, bio, photo, order]
    profesional_formacion:
      maps_to: profesional.credentials
      parent_key: profesional_slug
      columns: [profesional_slug, position, title, year, institution, description]
    testimonios:
      maps_to: testimonio
      columns: [slug, client_name, quote, about_type, about_slug, order]
    ajustes:
      maps_to: settings
      columns: [key, value]

